<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>הדמיית גדרות 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Assistant', sans-serif;
        background-color: #f1f5f9;
      }
      #canvas-container {
        position: absolute;
        inset: 0;
      }
      #canvas-container canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hint {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #e2e8f0;
        padding: 10px 12px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 320px;
        font-size: 12px;
        color: #0f172a;
      }
      .hint b { font-weight: 800; }
      .record-btn {
        position: absolute;
        top: 52px;
        right: 12px;
        z-index: 20;
        border: 1px solid #be123c;
        background: #e11d48;
        color: #fff;
        border-radius: 10px;
        padding: 8px 12px;
        font-weight: 800;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }
      .record-btn.recording {
        border-color: #047857;
        background: #059669;
      }
      body.view-only .hint,
      body.view-only .record-btn,
      body.view-only .env-bar { display: none !important; }
      body.view-only #view-orbit-hint { display: block; }
      #view-orbit-hint {
        display: none;
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        pointer-events: none;
        background: rgba(15, 23, 42, 0.82);
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 999px;
        white-space: nowrap;
        font-family: 'Assistant', sans-serif;
      }
      .env-bar {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        gap: 8px;
        direction: rtl;
      }
      .env-chip {
        border: 1px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 14px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 800;
        color: #334155;
        cursor: pointer;
        font-family: 'Assistant', sans-serif;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        line-height: 1.25;
        min-width: 118px;
        text-align: center;
      }
      .env-chip small {
        display: block;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        margin-top: 2px;
      }
      .env-chip.active {
        background: #1e3a5f;
        border-color: #1e3a5f;
        color: #fff;
      }
      .env-chip.active small { color: #bfdbfe; }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="view-orbit-hint">גרור לסיבוב · צביטה לזום</div>
    <button id="btn-record-fence" class="record-btn">⏺️ התחל הקלטה</button>
    <div class="env-bar" id="env-bar">
      <button type="button" class="env-chip active" data-env="villa">🏡 וילה<small>דשא פתוח</small></button>
      <button type="button" class="env-chip" data-env="garden">🌿 דירת גן<small>חצר אינטימית</small></button>
    </div>
    <div class="hint">
      <b>הדמיית גדר</b><br />
      מקטע = לוחצים שמאל או ימין. שער רק אם בחרתם בטופס. לחיצה על השער פותחת וסוגרת.
    </div>
    <script>
      let scene, camera, renderer, controls;
      let fenceGroup = null;
      let envSceneryGroup = null;
      let floorMesh = null;
      let currentEnv = "villa";
      let envYardL = 10;
      let envYardW = 5;
      let envGateX = 0;
      /** מטרים של חצר קדמית — הגדר ממול הבית, לא צמודה לקיר */
      const FRONT_YARD_M = 6.8;
      const GATE_M = 1.5;
      let pendingFenceConfig = null;
      let lastFenceConfig = null;
      let fenceRecorder = null;
      let fenceRecChunks = [];
      let fenceUserOrbited = false;
      let gateRoot = null;
      let gateLeftPivot = null;
      let gateRightPivot = null;
      let gateOpen = false;
      let gateAngle = 0;
      const GATE_OPEN_ANGLE = 1.35;
      const gateRaycaster = new THREE.Raycaster();
      const gatePointer = new THREE.Vector2();
      let gatePtrDown = null;

      function fitFenceRenderer() {
        if (!renderer || !camera) return;
        const container = document.getElementById("canvas-container");
        const w = (container && container.clientWidth) || window.innerWidth;
        const h = (container && container.clientHeight) || window.innerHeight;
        if (w < 2 || h < 2) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function notifyFenceReady() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "simReady", k: "f" }, "*");
          }
        } catch (e) {}
      }

      const CM_TO_M = 0.01;

      // Visual post width: want "thicker" like 60/40.
      // This is only an approximation for the 3D preview.
      const postWm = 0.06;
      const postDepth = 0.08; // visual depth
      // Make the fill depth close to the post depth so posts appear "embedded in the profile"
      const stepDepth = 0.07;
      const rosetteWm = postWm * 1.45;
      const rosetteDepth = postDepth * 1.05;
      const rosetteThkM = 0.03;

      const postGeom = new THREE.BoxGeometry(postWm, 1, postDepth);
      const stepGeom = new THREE.BoxGeometry(1, 0.1, stepDepth);
      const spacerGeom = new THREE.BoxGeometry(0.03, 1, 0.015);

      /** זיגזג אטום 120/20 — 3 שיאים בולטים, ניכר גם מרחוק */
      function createZigzagSlat(widthM, heightM, colorHex) {
        const group = new THREE.Group();
        const bands = 5; // 3 בולטים + 2 שקועים
        const bandH = Math.max(0.01, heightM / bands);
        const deep = 0.095;
        const shallow = 0.014;
        const hex = hexToInt(colorHex);
        const cr = (hex >> 16) & 255, cg = (hex >> 8) & 255, cb = hex & 255;
        const isNearWhite = (cr * 0.299 + cg * 0.587 + cb * 0.114) > 220;
        const baseCol = isNearWhite ? 0xe6eaef : hex;
        // שקועים קצת כהים יותר — קונטרסט שרואים מרחוק
        const recessCol = isNearWhite
          ? 0xb8c0c8
          : (Math.floor(cr * 0.72) << 16) | (Math.floor(cg * 0.72) << 8) | Math.floor(cb * 0.72);

        for (let i = 0; i < bands; i++) {
          const raised = i % 2 === 0;
          const d = raised ? deep : shallow;
          const mat = new THREE.MeshStandardMaterial({
            color: raised ? baseCol : recessCol,
            roughness: raised ? 0.36 : 0.55,
            metalness: raised ? 0.32 : 0.18,
          });
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(widthM, bandH * 0.992, d), mat);
          mesh.position.set(0, -heightM / 2 + bandH * (i + 0.5), raised ? 0.01 : -0.02);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          group.add(mesh);
        }
        // קווי צל בצדדים — מדגישים את הגל
        const edgeMat = new THREE.MeshStandardMaterial({
          color: isNearWhite ? 0x9aa3ad : recessCol,
          roughness: 0.5,
          metalness: 0.25,
        });
        for (let i = 0; i < bands; i++) {
          if (i % 2 !== 0) continue;
          const lip = new THREE.Mesh(new THREE.BoxGeometry(widthM, Math.min(0.012, bandH * 0.22), deep + 0.008), edgeMat);
          lip.position.set(0, -heightM / 2 + bandH * (i + 0.5) + bandH * 0.38, 0.012);
          group.add(lip);
          const lip2 = lip.clone();
          lip2.position.y = -heightM / 2 + bandH * (i + 0.5) - bandH * 0.38;
          group.add(lip2);
        }
        return group;
      }

      function placeSlatMesh(widthM, heightM, colorHex, slatProfile, midX, midY, midZ, yaw) {
        if (slatProfile === "zigzag") {
          const mesh = createZigzagSlat(widthM, heightM, colorHex);
          placeOriented(mesh, midX, midY, midZ, yaw);
          return mesh;
        }
        const step = createBox(widthM, heightM, stepDepth, colorHex, 1);
        placeOriented(step, midX, midY, midZ, yaw);
        return step;
      }

      function clearFence() {
        if (fenceGroup) {
          scene.remove(fenceGroup);
          while (fenceGroup.children.length) fenceGroup.remove(fenceGroup.children[0]);
          fenceGroup = null;
        }
        gateRoot = null;
        gateLeftPivot = null;
        gateRightPivot = null;
      }

      function applyGateAngle() {
        // פתיחה פנימה (לחצר, מול המצלמה = −Z)
        if (gateLeftPivot) gateLeftPivot.rotation.y = gateAngle;
        if (gateRightPivot) gateRightPivot.rotation.y = -gateAngle;
      }

      function toggleGate() {
        if (!gateRoot) return;
        gateOpen = !gateOpen;
      }

      function markGateMesh(mesh) {
        mesh.userData.gate = true;
        return mesh;
      }

      /** ידית דקורטיבית 20/40 — מבחוץ על מילוי הזיגזג, מבפנים חצי */
      function buildGateHandles(parent, x, Hm, colorHex, faceOutZ) {
        const barW = 0.04;
        const barT = 0.02;
        const standLen = 0.055;
        const standSec = 0.016;
        const faceZ = faceOutZ || 0.05;
        const fullH = Math.min(Hm * 0.7, Math.max(0.55, Hm - 0.26));
        const halfH = fullH * 0.5;
        const midY = Hm * 0.52;

        function addBar(yCenter, height, zSign, face) {
          const zBar = zSign * (face + standLen + barT / 2);
          const bar = markGateMesh(createBox(barW, height, barT, colorHex, 1));
          bar.position.set(x, yCenter, zBar);
          parent.add(bar);
          const yTop = yCenter + height / 2 - 0.02;
          const yBot = yCenter - height / 2 + 0.02;
          [yTop, yBot].forEach(function (yy) {
            const stub = markGateMesh(createBox(standSec, standSec, standLen, colorHex, 1));
            stub.position.set(x, yy, zSign * (face + standLen / 2));
            parent.add(stub);
          });
        }

        // חוץ: ידית מלאה על פני הזיגזג
        addBar(midY, fullH, 1, faceZ);
        // פנים: חצי ידית
        addBar(midY, halfH, -1, faceZ * 0.85);

        const lockMat = new THREE.MeshStandardMaterial({
          color: 0xc0c4c8,
          metalness: 0.85,
          roughness: 0.25,
        });
        const lock = markGateMesh(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.018, 14), lockMat));
        lock.rotation.x = Math.PI / 2;
        lock.position.set(x + 0.03, midY, faceZ + 0.008);
        parent.add(lock);
      }

      function buildEntranceGate(opts) {
        if (!fenceGroup || currentEnv === "garden") return;
        const Hcm = Math.max(80, Number(opts.Hcm || 0));
        const Hm = Hcm * CM_TO_M;
        const slatProfile = opts.slatProfile || "100";
        const isZigzag = slatProfile === "zigzag";
        const gapCm = isZigzag ? 0 : Number(opts.gapCm || 0);
        const patternCm = getSlatPattern(slatProfile);
        const frameHex = opts.frameHex || "#555555";
        const slatHex = opts.slatHex || "#ffffff";
        const spacerHex = opts.spacerHex || frameHex;
        const g = GATE_M / 2;
        const hingeInset = postWm / 2 + 0.003;
        const hingeL = -g + hingeInset;
        const hingeR = g - hingeInset;
        const opening = Math.max(0.4, hingeR - hingeL);
        const midGap = 0.01;
        const leafW = (opening - midGap) / 2;
        const stile = 0.04;
        const rail = 0.035;
        const leafDepth = postDepth * 0.95;
        const leaves = opts.leaves === "single" ? "single" : "double";

        gateRoot = new THREE.Group();
        gateRoot.position.set(0, 0, 0.01);
        fenceGroup.add(gateRoot);

        function addToPivot(pivot, mesh, x, y, z) {
          markGateMesh(mesh);
          mesh.position.set(x, y, z);
          pivot.add(mesh);
          if (mesh.isGroup) {
            mesh.traverse(function (ch) {
              if (ch.isMesh) markGateMesh(ch);
            });
          }
        }

        function fillLeaf(pivot, sign, width) {
          const w = Math.max(0.25, width);
          // משקופים אנכיים + אופקיים — מסגרת מלאה
          addToPivot(pivot, createBox(stile, Hm, leafDepth, frameHex), sign * (stile / 2), Hm / 2, 0);
          addToPivot(pivot, createBox(stile, Hm, leafDepth, frameHex), sign * (w - stile / 2), Hm / 2, 0);
          const railW = Math.max(0.02, w - stile * 2);
          addToPivot(pivot, createBox(railW, rail, leafDepth, frameHex), sign * (w / 2), rail / 2, 0);
          addToPivot(pivot, createBox(railW, rail, leafDepth, frameHex), sign * (w / 2), Hm - rail / 2, 0);

          // מילוי ממלא בדיוק בין המשקופים (מרכז העלה)
          const innerW = Math.max(0.05, w - stile * 2 + 0.004);
          const midX = sign * (w / 2);
          const railCm = rail / CM_TO_M;
          const netHcm = isZigzag ? Math.max(0, Hcm - 1.5) : Math.max(0, Hcm - 1.5 - railCm * 2);
          const bottomOffsetCm = isZigzag ? 0.75 : railCm;
          let cumulativeCm = 0;
          let stepIndex = 0;
          const steps = [];
          while (true) {
            const tCm = patternCm[stepIndex % patternCm.length];
            if (cumulativeCm + tCm > netHcm + 1e-9) break;
            steps.push({ tCm, centerCm: bottomOffsetCm + cumulativeCm + tCm / 2 });
            cumulativeCm += tCm + Math.max(0, gapCm);
            stepIndex++;
          }
          steps.forEach(function (st) {
            const h = st.tCm * CM_TO_M;
            const y = st.centerCm * CM_TO_M;
            if (isZigzag) {
              addToPivot(pivot, createZigzagSlat(innerW, h, slatHex), midX, y, 0);
            } else {
              addToPivot(pivot, createBox(innerW, h, stepDepth, slatHex, 1), midX, y, 0);
            }
          });
          if (steps.length >= 2 && gapCm > 0) {
            const spacerH = Math.max(0.005, gapCm * CM_TO_M);
            for (let i = 0; i < steps.length - 1; i++) {
              const sy = ((steps[i].centerCm + steps[i + 1].centerCm) / 2) * CM_TO_M;
              addToPivot(pivot, createBox(0.016, spacerH, 0.028, spacerHex, 1), sign * (stile + 0.01), sy, 0);
              addToPivot(pivot, createBox(0.016, spacerH, 0.028, spacerHex, 1), sign * (w - stile - 0.01), sy, 0);
            }
          }
          const hingeMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.7, roughness: 0.3 });
          const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.08, 10), hingeMat);
          addToPivot(pivot, hinge, 0, Hm * 0.22, 0);
          const hinge2 = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.08, 10), hingeMat);
          addToPivot(pivot, hinge2, 0, Hm * 0.78, 0);
          // ידית על מילוי הזיגזג — ליד צד הפתיחה (לא באמצע, לא על המשקוף)
          const handleX = sign * (w - stile - 0.08);
          const zigFaceZ = isZigzag ? 0.055 : postDepth * 0.45;
          buildGateHandles(pivot, handleX, Hm, frameHex, zigFaceZ);
        }

        if (leaves === "single") {
          gateLeftPivot = new THREE.Group();
          gateLeftPivot.position.set(hingeL, 0, 0);
          gateRoot.add(gateLeftPivot);
          fillLeaf(gateLeftPivot, 1, opening - 0.006);
          gateRightPivot = null;
        } else {
          gateLeftPivot = new THREE.Group();
          gateLeftPivot.position.set(hingeL, 0, 0);
          gateRoot.add(gateLeftPivot);
          fillLeaf(gateLeftPivot, 1, leafW);

          gateRightPivot = new THREE.Group();
          gateRightPivot.position.set(hingeR, 0, 0);
          gateRoot.add(gateRightPivot);
          fillLeaf(gateRightPivot, -1, leafW);
        }

        gateOpen = false;
        gateAngle = 0;
        applyGateAngle();
      }

      function getSlatPattern(slatProfile) {
        // Heights in CM (mapped to getPatFence() in app/page.tsx)
        // getPatFence uses:
        //  - 100 => [{ w: 10, ... }, ...] meaning slat block height ~10cm
        //  - 70  => w: 7
        //  - 40  => w: 4
        //  - 20  => w: 2
        // and mixes include 20/40/70 blocks in the same order.
        // We simulate the same by returning the W sequence in cm.
        // In app/page.tsx getPatFence():
        // 100/20 -> block height uses w=10 (single block)
        // 70/20  -> uses w=7  (single block)
        // 40/20  -> uses w=4  (single block)
        // 20/20  -> uses w=2  (single block)
        // mixes are sequences of these blocks (no implicit extra 20 block)
        if (slatProfile === "100") return [10];
        if (slatProfile === "70") return [7];
        if (slatProfile === "40") return [4];
        if (slatProfile === "20") return [2];
        if (slatProfile === "zigzag") return [12];
        if (slatProfile === "mix1") return [4, 4, 7];
        if (slatProfile === "mix2") return [4, 4, 2, 2, 7];
        return [1.0];
      }

      function hexToInt(hex) {
        // Accept #RRGGBB or any css-like; postMessage will send #ffffff etc.
        try {
          if (!hex) return 0x777777;
          const h = String(hex).trim().replace('#', '');
          return parseInt(h.length ? h : "777777", 16);
        } catch (e) {
          return 0x777777;
        }
      }

      function createBox(w, h, d, colorHex, opacity = 1) {
        const geom = new THREE.BoxGeometry(w, h, d);
        const hex = hexToInt(colorHex);
        const cr = (hex >> 16) & 255, cg = (hex >> 8) & 255, cb = hex & 255;
        const isNearWhite = (cr * 0.299 + cg * 0.587 + cb * 0.114) > 220;
        const mat = new THREE.MeshStandardMaterial({
          color: isNearWhite ? 0xe6eaef : hex,
          transparent: opacity < 1,
          opacity: opacity,
          roughness: isNearWhite ? 0.38 : 0.45,
          metalness: isNearWhite ? 0.28 : 0.28,
        });
        return new THREE.Mesh(geom, mat);
      }

      function envBox(w, h, d, colorInt) {
        const mat = new THREE.MeshStandardMaterial({
          color: colorInt,
          roughness: 0.78,
          metalness: 0.04,
        });
        return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      }

      function clearGroup(group) {
        if (!group) return;
        while (group.children.length) group.remove(group.children[0]);
      }

      function addBuildingWindows(parent, w, h, d, x, y, z, faceSign, winColor) {
        const cols = Math.max(2, Math.round(w / 1.6));
        const rows = Math.max(3, Math.round(h / 2.4));
        const winW = Math.min(0.72, (w / (cols + 1)) * 0.58);
        const winH = 0.92;
        const mat = new THREE.MeshStandardMaterial({
          color: winColor,
          emissive: winColor,
          emissiveIntensity: 0.12,
          roughness: 0.15,
          metalness: 0.15,
        });
        const face = faceSign == null ? 1 : faceSign;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const wx = x - w / 2 + (c + 1) * (w / (cols + 1));
            const wy = y - h / 2 + 1.35 + r * ((h - 2.0) / Math.max(1, rows - 0.2));
            const pane = new THREE.Mesh(new THREE.BoxGeometry(winW, winH, 0.05), mat);
            pane.position.set(wx, wy, z + face * (d / 2 + 0.03));
            parent.add(pane);
          }
        }
      }

      function addSideWindows(parent, w, h, d, x, y, z, xSign, winColor) {
        const cols = Math.max(2, Math.round(d / 1.7));
        const rows = Math.max(3, Math.round(h / 2.4));
        const winW = Math.min(0.7, (d / (cols + 1)) * 0.5);
        const winH = 0.9;
        const mat = new THREE.MeshStandardMaterial({
          color: winColor,
          emissive: winColor,
          emissiveIntensity: 0.12,
          roughness: 0.15,
          metalness: 0.15,
        });
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const wz = z - d / 2 + (c + 1) * (d / (cols + 1));
            const wy = y - h / 2 + 1.35 + r * ((h - 2.0) / Math.max(1, rows - 0.2));
            const pane = new THREE.Mesh(new THREE.BoxGeometry(0.05, winH, winW), mat);
            pane.position.set(x + xSign * (w / 2 + 0.03), wy, wz);
            parent.add(pane);
          }
        }
      }

      function addPlanter(parent, x, z) {
        const pot = envBox(0.52, 0.28, 0.32, 0xc4784a);
        pot.position.set(x, 0.16, z);
        parent.add(pot);
        const leaf = envBox(0.46, 0.34, 0.26, 0x3d8c45);
        leaf.position.set(x, 0.44, z);
        parent.add(leaf);
        const leaf2 = envBox(0.22, 0.22, 0.18, 0x2f6b36);
        leaf2.position.set(x + 0.08, 0.58, z);
        parent.add(leaf2);
      }

      function syncEnvChips() {
        const chips = document.querySelectorAll(".env-chip");
        for (let i = 0; i < chips.length; i++) {
          chips[i].classList.toggle("active", chips[i].getAttribute("data-env") === currentEnv);
        }
      }

      function applyEnvironmentLook() {
        const grass = currentEnv === "garden" ? 0x5c7a32 : 0x4d7c0f;
        const bg = currentEnv === "garden" ? 0xf3ebe0 : 0xf1f5f9;
        if (scene) {
          scene.background = new THREE.Color(bg);
          if (renderer) renderer.setClearColor(bg, 1);
        }
        if (floorMesh && floorMesh.material && floorMesh.material.color) {
          floorMesh.material.color.setHex(grass);
          floorMesh.material.roughness = 0.95;
        }
      }

      function rebuildEnvScenery() {
        if (!envSceneryGroup) return;
        clearGroup(envSceneryGroup);
        const L = Math.max(8, envYardL);
        const fenceDepth = Math.max(0.25, envYardW);
        const hasSide = fenceDepth > 1.2;
        const fenceFrontZ = fenceDepth / 2;
        const houseFrontZ = hasSide ? -fenceDepth / 2 - 1.15 : -FRONT_YARD_M;
        const yardLen = Math.max(2.2, fenceFrontZ - houseFrontZ);

        if (currentEnv === "garden") {
          const homeH = 16.5;
          const homeD = 8.2;
          const homeW = Math.max(L + 3.6, 9);
          const homeZ = houseFrontZ - homeD / 2;
          const home = envBox(homeW, homeH, homeD, 0xf3e2cc);
          home.position.set(0, homeH / 2, homeZ);
          envSceneryGroup.add(home);
          addBuildingWindows(envSceneryGroup, homeW - 0.8, homeH - 3.8, homeD, 0, homeH / 2 + 1.6, homeZ, 1, 0x8ecae6);
          addSideWindows(envSceneryGroup, homeW, homeH - 3.2, homeD, 0, homeH / 2 + 1.2, homeZ, 1, 0x8ecae6);
          addSideWindows(envSceneryGroup, homeW, homeH - 3.2, homeD, 0, homeH / 2 + 1.2, homeZ, -1, 0x8ecae6);
          const gDoor = envBox(1.05, 2.15, 0.08, 0x6b3f24);
          gDoor.position.set(currentEnv === "garden" ? 0 : envGateX, 1.08, houseFrontZ + 0.05);
          envSceneryGroup.add(gDoor);
          if (currentEnv !== "garden") {
            const gPath = envBox(1.15, 0.04, yardLen);
            gPath.position.set(envGateX, 0.02, houseFrontZ + yardLen / 2);
            envSceneryGroup.add(gPath);
          }

          const hedge = function (w, h, d, x, z) {
            const m = envBox(w, h, d, 0x3f6b32);
            m.position.set(x, h / 2, z);
            envSceneryGroup.add(m);
          };
          hedge(0.38, 1.05, yardLen + 1.2, -L / 2 - 2.4, houseFrontZ + yardLen / 2);
          hedge(0.38, 1.05, yardLen + 1.2, L / 2 + 2.4, houseFrontZ + yardLen / 2);
          addPlanter(envSceneryGroup, -L / 2 - 1.35, fenceFrontZ - 0.35);
          addPlanter(envSceneryGroup, L / 2 + 1.35, fenceFrontZ - 0.35);

          const neighbors = [
            { x: -13.2, z: -1.5, w: 6.0, d: 5.2, h: 11, c: 0xe8c9a8, win: 0x7eb8d4 },
            { x: -12.5, z: -9.8, w: 5.6, d: 5.0, h: 14, c: 0xd9a066, win: 0xb8e0f0 },
            { x: -6.5, z: -15.5, w: 6.4, d: 5.4, h: 12, c: 0xf7e6d0, win: 0x70b8d4 },
            { x: 5.8, z: -15.0, w: 5.8, d: 5.0, h: 13, c: 0xc45c3e, win: 0xa8d8ea },
            { x: 14.2, z: -8.5, w: 5.4, d: 4.8, h: 10, c: 0xead9c4, win: 0x9ad1e8 },
            { x: 15.5, z: -1.2, w: 5.2, d: 4.6, h: 9, c: 0x88b089, win: 0xe8f8d8 },
          ];
          neighbors.forEach(function (b) {
            const cy = b.h / 2;
            const mesh = envBox(b.w, b.h, b.d, b.c);
            mesh.position.set(b.x, cy, b.z);
            envSceneryGroup.add(mesh);
            addBuildingWindows(envSceneryGroup, b.w, b.h, b.d, b.x, cy, b.z, 1, b.win);
            if (b.x < -6) addSideWindows(envSceneryGroup, b.w, b.h, b.d, b.x, cy, b.z, 1, b.win);
            if (b.x > 6) addSideWindows(envSceneryGroup, b.w, b.h, b.d, b.x, cy, b.z, -1, b.win);
          });
          return;
        }

        const vW = Math.max(L + 5.5, 11);
        const vH = 6.4;
        const vD = 7.4;
        const vZ = houseFrontZ - vD / 2;
        const house = envBox(vW, vH, vD, 0xf6ead6);
        house.position.set(0, vH / 2, vZ);
        envSceneryGroup.add(house);
        const wing = envBox(3.6, 4.4, 5.2, 0xf0e0c8);
        wing.position.set(vW / 2 + 1.1, 2.2, vZ - 0.6);
        envSceneryGroup.add(wing);
        const roofCol = 0xc45c3e;
        const roofA = envBox(vW + 0.7, 0.16, vD * 0.78, roofCol);
        roofA.rotation.x = 0.42;
        roofA.position.set(0, vH + 0.85, vZ - vD * 0.16);
        envSceneryGroup.add(roofA);
        const roofB = envBox(vW + 0.7, 0.16, vD * 0.78, roofCol);
        roofB.rotation.x = -0.42;
        roofB.position.set(0, vH + 0.85, vZ + vD * 0.16);
        envSceneryGroup.add(roofB);
        const roofWing = envBox(4.2, 0.16, 4.4, roofCol);
        roofWing.rotation.x = -0.38;
        roofWing.position.set(vW / 2 + 1.1, 4.9, vZ - 0.3);
        envSceneryGroup.add(roofWing);
        const chim = envBox(0.42, 1.35, 0.42, 0xddd0c0);
        chim.position.set(-vW * 0.22, vH + 1.55, vZ);
        envSceneryGroup.add(chim);
        addBuildingWindows(envSceneryGroup, vW - 1.2, 2.4, vD, 0, 4.55, vZ, 1, 0x9ad4ea);
        addSideWindows(envSceneryGroup, vW, vH - 1.5, vD, 0, vH / 2 + 0.4, vZ, 1, 0x9ad4ea);
        addSideWindows(envSceneryGroup, vW, vH - 1.5, vD, 0, vH / 2 + 0.4, vZ, -1, 0x9ad4ea);
        const door = envBox(1.05, 2.15, 0.08, 0x6b3f24);
        door.position.set(envGateX, 1.08, houseFrontZ + 0.05);
        envSceneryGroup.add(door);
        const path = envBox(1.2, 0.04, yardLen);
        path.position.set(envGateX, 0.02, houseFrontZ + yardLen / 2);
        envSceneryGroup.add(path);

        const poolX = -L / 2 - 5.1;
        const poolZ = Math.max(0.2, fenceFrontZ * 0.15);
        const deck = envBox(6.6, 0.07, 4.4, 0xe6dccf);
        deck.position.set(poolX, 0.02, poolZ);
        envSceneryGroup.add(deck);
        const water = new THREE.Mesh(
          new THREE.BoxGeometry(4.9, 0.08, 2.85),
          new THREE.MeshStandardMaterial({
            color: 0x2f9fd4,
            roughness: 0.06,
            metalness: 0.35,
            transparent: true,
            opacity: 0.82,
          })
        );
        water.position.set(poolX, 0.055, poolZ);
        envSceneryGroup.add(water);
        const copA = envBox(5.3, 0.1, 0.22, 0xd9d0c4);
        copA.position.set(poolX, 0.08, poolZ + 1.52);
        envSceneryGroup.add(copA);
        const copB = envBox(5.3, 0.1, 0.22, 0xd9d0c4);
        copB.position.set(poolX, 0.08, poolZ - 1.52);
        envSceneryGroup.add(copB);
        const copC = envBox(0.22, 0.1, 3.05, 0xd9d0c4);
        copC.position.set(poolX - 2.55, 0.08, poolZ);
        envSceneryGroup.add(copC);
        const copD = envBox(0.22, 0.1, 3.05, 0xd9d0c4);
        copD.position.set(poolX + 2.55, 0.08, poolZ);
        envSceneryGroup.add(copD);
        addPlanter(envSceneryGroup, poolX - 2.7, poolZ + 1.85);
        addPlanter(envSceneryGroup, poolX + 2.7, poolZ + 1.85);
        const hedgeV = envBox(0.35, 0.85, 3.2, 0x3f6b32);
        hedgeV.position.set(poolX - 3.4, 0.425, poolZ);
        envSceneryGroup.add(hedgeV);
        const hedgeR = envBox(1.8, 0.7, 0.35, 0x3f6b32);
        hedgeR.position.set(L / 2 + 2.3, 0.35, fenceFrontZ - 0.5);
        envSceneryGroup.add(hedgeR);
      }

      function applyEnvironment(id) {
        if (id !== "villa" && id !== "garden") return;
        currentEnv = id;
        syncEnvChips();
        applyEnvironmentLook();
        if (lastFenceConfig) {
          buildFence(lastFenceConfig);
        } else {
          rebuildEnvScenery();
        }
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "simEnv", k: "f", env: currentEnv }, "*");
          }
        } catch (e) {}
      }

      function wireEnvChips() {
        const bar = document.getElementById("env-bar");
        if (!bar) return;
        bar.addEventListener("click", function (ev) {
          const btn = ev.target && ev.target.closest ? ev.target.closest(".env-chip") : null;
          if (!btn) return;
          applyEnvironment(btn.getAttribute("data-env"));
        });
      }

      function yawFromDir(dx, dz) {
        return Math.atan2(-dz, dx);
      }

      function placeOriented(mesh, x, y, z, yaw) {
        mesh.position.set(x, y, z);
        mesh.rotation.y = yaw;
        fenceGroup.add(mesh);
      }

      function buildFence(config) {
        if (!scene) {
          pendingFenceConfig = config;
          return;
        }
        const segments = Array.isArray(config?.segments) ? config.segments : [];
        const gapCmRaw = Number(config?.gapCm ?? 0);
        const slatProfile = config?.slatProfile ?? "100";
        const gapCm = slatProfile === "zigzag" ? 0 : gapCmRaw;
        const frameHex = config?.frameHex ?? "#555555";
        const slatHex = config?.slatHex ?? "#ffffff";
        const spacerHex = config?.spacerHex ?? frameHex;
        const inGround = !!config?.inGround;
        if (segments.length) lastFenceConfig = config;

        clearFence();
        fenceGroup = new THREE.Group();

        scene.add(fenceGroup);

        const patternCm = getSlatPattern(slatProfile);
        const isGarden = currentEnv === "garden";

        let totalLengthM = 0;
        let maxHeightM = 0;
        segments.forEach((s) => {
          const Lm = Math.max(0, Number(s.L || 0)) * CM_TO_M;
          const Hm = Math.max(0, Number(s.H || 0)) * CM_TO_M;
          totalLengthM += Lm;
          const extra = inGround ? 0.4 : 0;
          maxHeightM = Math.max(maxHeightM, Hm + extra);
        });

        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;

        function consider(x, z) {
          minX = Math.min(minX, x);
          maxX = Math.max(maxX, x);
          minZ = Math.min(minZ, z);
          maxZ = Math.max(maxZ, z);
        }

        function drawOneSegment(seg, originX, originZ, dx, dz, skipFirstPost, endAtCorner) {
          const Lcm = Math.max(0, Number(seg.L || 0));
          const Hcm = Math.max(0, Number(seg.H || 0));
          const posts = Math.max(0, Math.floor(Number(seg.P || 0)));
          const Lm = Lcm * CM_TO_M;
          const Hm = Hcm * CM_TO_M;
          const fields = Math.max(0, posts - 1);
          const fieldLenM = fields > 0 ? ((Lcm - posts * (postWm / CM_TO_M)) / fields) * CM_TO_M : 0;
          const postExtra = inGround ? 0.4 : 0;
          const postHeightM = Hm + postExtra;
          const yaw = yawFromDir(dx, dz);

          const postCenters = [];
          for (let i = 0; i < posts; i++) {
            let along = postWm / 2 + i * (fieldLenM + postWm);
            if (skipFirstPost && i === 0) along = 0;
            if (endAtCorner && i === posts - 1) along = Lm;
            const x = originX + dx * along;
            const z = originZ + dz * along;
            postCenters.push({ x, z });
            consider(x, z);
          }

          for (let i = 0; i < posts; i++) {
            if (skipFirstPost && i === 0) continue;
            const c = postCenters[i];
            const post = createBox(postWm, postHeightM, postDepth, frameHex);
            placeOriented(post, c.x, postHeightM / 2, c.z, yaw);
            const rosette = createBox(rosetteWm, rosetteThkM, rosetteDepth, frameHex, 1);
            placeOriented(rosette, c.x, rosetteThkM / 2, c.z, yaw);
          }

          if (fields > 0) {
            // בגדר תמיד מורידים 1.5 ס״מ מגובה המילוי
            const netHcm = Math.max(0, Hcm - 1.5);
            const bottomOffsetCm = 0.75;
            // מילוי נכנס לחריץ העמוד (~1 ס״מ מכל צד) — בלי רווח בין מילוי לעמוד
            const insertM = slatProfile === "zigzag" ? 0.012 : 0.008;

            for (let f = 0; f < fields; f++) {
              const leftPost = postCenters[f];
              const rightPost = postCenters[f + 1];
              if (!leftPost || !rightPost) continue;

              let cumulativeCm = 0;
              let stepIndex = 0;
              const steps = [];

              while (true) {
                const tCm = patternCm[stepIndex % patternCm.length];
                if (cumulativeCm + tCm > netHcm + 1e-9) break;
                const centerCm = bottomOffsetCm + cumulativeCm + tCm / 2;
                steps.push({ tCm, centerCm });
                cumulativeCm += tCm + Math.max(0, gapCm);
                stepIndex++;
              }

              const dist = Math.hypot(rightPost.x - leftPost.x, rightPost.z - leftPost.z);
              const clearWidthM = Math.max(0, dist - postWm);
              const w = Math.max(0.001, clearWidthM + insertM * 2);
              const midX = (leftPost.x + rightPost.x) / 2;
              const midZ = (leftPost.z + rightPost.z) / 2;

              steps.forEach((st) => {
                const h = st.tCm * CM_TO_M;
                const y = st.centerCm * CM_TO_M;
                placeSlatMesh(w, h, slatHex, slatProfile, midX, y, midZ, yaw);
              });

              if (steps.length >= 2 && gapCm > 0) {
                const spacerW = 0.03;
                const spacerD = 0.04;
                const spacerH = Math.max(0.005, gapCm * CM_TO_M);
                for (let i = 0; i < steps.length - 1; i++) {
                  const prev = steps[i];
                  const next = steps[i + 1];
                  const spacerY = ((prev.centerCm + next.centerCm) / 2) * CM_TO_M;
                  const leftX = leftPost.x + dx * (postWm / 2 + spacerW / 2);
                  const leftZ = leftPost.z + dz * (postWm / 2 + spacerW / 2);
                  const rightX = rightPost.x - dx * (postWm / 2 + spacerW / 2);
                  const rightZ = rightPost.z - dz * (postWm / 2 + spacerW / 2);
                  const s1 = createBox(spacerW, spacerH, spacerD, spacerHex, 1);
                  placeOriented(s1, leftX, spacerY, leftZ, yaw);
                  const s2 = createBox(spacerW, spacerH, spacerD, spacerHex, 1);
                  placeOriented(s2, rightX, spacerY, rightZ, yaw);
                }
              }
            }
          }
        }

        function collectYardRuns(segs) {
          const runs = [];
          let i = 0;
          while (i < segs.length) {
            const front = segs[i];
            i += 1;
            const sides = [];
            while (i < segs.length && segs[i].connected) {
              sides.push(segs[i]);
              i += 1;
            }
            runs.push({ front: front, sides: sides });
          }
          return runs;
        }

        function drawYardSeg(seg, ox, oz, dx, dz, skipFirst, endCorner) {
          if (!seg) return 0;
          const Lm = Math.max(0, Number(seg.L || 0)) * CM_TO_M;
          consider(ox, oz);
          consider(ox + dx * Lm, oz + dz * Lm);
          drawOneSegment(seg, ox, oz, dx, dz, skipFirst, endCorner);
          return Lm;
        }

        function drawRunPolyline(front, sides, originX, originZ, dirs) {
          let ox = originX;
          let oz = originZ;
          let heading = 0;
          function turns90(seg) {
            return !!seg && !!seg.connected && seg.corner !== false;
          }
          const nextTurns = sides.length > 0;
          const Lm0 = drawYardSeg(front, ox, oz, dirs[0][0], dirs[0][1], false, nextTurns);
          ox += dirs[0][0] * Lm0;
          oz += dirs[0][1] * Lm0;
          for (let s = 0; s < sides.length; s++) {
            if (turns90(sides[s])) heading = (heading + 1) % 4;
            const d = dirs[heading];
            const next = s + 1 < sides.length;
            const Lm = drawYardSeg(sides[s], ox, oz, d[0], d[1], true, next);
            ox += d[0] * Lm;
            oz += d[1] * Lm;
          }
          return { ox: ox, oz: oz, along: Math.max(0, Number(front.L || 0)) * CM_TO_M };
        }

        const LEFT_DIRS = [[-1, 0], [0, -1], [1, 0], [0, 1]];
        const RIGHT_DIRS = [[1, 0], [0, -1], [-1, 0], [0, 1]];
        const runs = collectYardRuns(segments);
        function runYardSide(run, fallbackIdx) {
          const s = run && run.front && run.front.side;
          if (s === "left" || s === "right") return s;
          return fallbackIdx === 0 ? "left" : "right";
        }
        const gateKind = config.gate === "single" || config.gate === "double" ? config.gate : "none";
        const useOpening = !isGarden || gateKind !== "none";
        /** עם בחירת צד — לא למרכז ב־X, כדי ששמאל יישאר משמאל לשביל וימין מימין */
        let keepGateAtOriginX = false;

        if (!useOpening) {
          for (let r = 0; r < runs.length; r++) {
            const run = runs[r];
            if (!run || !run.front) continue;
            const legacyU =
              r === 0 &&
              run.sides.length === 2 &&
              run.sides.every(function (s) { return s.corner !== false; });
            if (legacyU) {
              const Lm = Math.max(0, Number(run.front.L || 0)) * CM_TO_M;
              drawYardSeg(run.front, -Lm / 2, 0, 1, 0, false, true);
              drawYardSeg(run.sides[0], -Lm / 2, 0, 0, -1, true, false);
              drawYardSeg(run.sides[1], Lm / 2, 0, 0, -1, true, false);
            } else {
              const side = runYardSide(run, r);
              keepGateAtOriginX = true;
              let ox = 0;
              if (r === 0) {
                const straight = Math.max(0, Number(run.front.L || 0)) * CM_TO_M;
                // שמאל משמאל למרכז, ימין מימין למרכז (לא ממורכז לתוך האמצע)
                ox = side === "left" ? -straight : 0;
              } else {
                let base = Math.max(0, Number(runs[0].front.L || 0)) * CM_TO_M / 2 + 0.35;
                ox = side === "left" ? -base : base;
                for (let p = 1; p < r; p++) {
                  if (runYardSide(runs[p], p) === side) {
                    ox += (side === "left" ? -1 : 1) * (Math.max(0, Number(runs[p].front.L || 0)) * CM_TO_M + 0.35);
                  }
                }
              }
              drawRunPolyline(run.front, run.sides, ox, 0, side === "left" ? LEFT_DIRS : RIGHT_DIRS);
            }
          }
        } else {
          keepGateAtOriginX = true;
          const g = GATE_M / 2;
          let gateHcm = 0;
          let leftCursor = -g;
          let rightCursor = g;
          let leftUsed = false;
          let rightUsed = false;
          for (let r = 0; r < runs.length; r++) {
            const run = runs[r];
            if (!run || !run.front) continue;
            gateHcm = Math.max(gateHcm, Number(run.front.H || 0));
            const side = runYardSide(run, r);
            if (side === "left") {
              if (leftUsed) leftCursor -= 0.35;
              const drawn = drawRunPolyline(run.front, run.sides, leftCursor, 0, LEFT_DIRS);
              leftCursor = drawn.ox;
              leftUsed = true;
            } else {
              if (rightUsed) rightCursor += 0.35;
              const drawn = drawRunPolyline(run.front, run.sides, rightCursor, 0, RIGHT_DIRS);
              rightCursor = drawn.ox;
              rightUsed = true;
            }
          }
          if (gateKind !== "none" && gateHcm > 0) {
            buildEntranceGate({
              Hcm: gateHcm,
              gapCm: gapCm,
              slatProfile: slatProfile,
              frameHex: frameHex,
              slatHex: slatHex,
              spacerHex: spacerHex,
              leaves: gateKind,
            });
          }
        }

        if (minX !== Infinity) {
          const shiftX = keepGateAtOriginX ? 0 : -(minX + maxX) / 2;
          const shiftZ = -(minZ + maxZ) / 2;
          fenceGroup.position.set(shiftX, 0, shiftZ);
          envYardL = Math.max(8, maxX - minX);
          envYardW = Math.max(0.25, maxZ - minZ);
          envGateX = 0;
        }

        rebuildEnvScenery();
        fitFenceRenderer();

        if (!fenceUserOrbited && camera && controls) {
          const span = Math.max(1, maxX - minX, maxZ - minZ, totalLengthM);
          const hasSide = envYardW > 1.2;
          const yardBack = hasSide ? -envYardW / 2 : -FRONT_YARD_M;
          const camDist = Math.max(10, span * 1.2, maxHeightM * 1.15, Math.abs(yardBack) * 1.15);
          // מצלמה מלפנים (לא מהצד) — שמאל המסך = שמאל החצר
          camera.position.set(0, maxHeightM * 0.75 + 3.6, camDist + 2.2);
          controls.target.set(0, maxHeightM * 0.28 + 0.8, yardBack * 0.22);
          controls.update();
        }
      }

      function init() {
        scene = new THREE.Scene();

        const container = document.getElementById("canvas-container");
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;

        camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 2000);
        camera.position.set(12, 8, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.max(1, window.devicePixelRatio || 1));
        renderer.setSize(w, h);
        renderer.setClearColor(0xf1f5f9, 1);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.minDistance = 2;
        controls.maxDistance = 80;
        controls.maxPolarAngle = Math.PI / 2.02;
        renderer.domElement.style.touchAction = "none";
        controls.addEventListener("start", function () {
          fenceUserOrbited = true;
        });

        // Lights
        const amb = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(amb);

        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(20, 30, 10);
        scene.add(sun);

        floorMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(100, 100),
          new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.95, metalness: 0.05 })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        scene.add(floorMesh);

        envSceneryGroup = new THREE.Group();
        scene.add(envSceneryGroup);

        applyEnvironmentLook();
        if (pendingFenceConfig) {
          const cfg = pendingFenceConfig;
          pendingFenceConfig = null;
          buildFence(cfg);
        } else {
          buildFence({ segments: [], gapCm: 2, slatProfile: "100", frameHex: "#555555", slatHex: "#ffffff", spacerHex: "#555555", inGround: false });
        }
        wireRecordButton();
        wireEnvChips();
        wireGatePointer();
        window.requestAnimationFrame(function () {
          fitFenceRenderer();
          notifyFenceReady();
        });
        window.setTimeout(function () {
          fitFenceRenderer();
          notifyFenceReady();
        }, 250);
      }

      function setFenceRecordButton(isRecording) {
        const btn = document.getElementById("btn-record-fence");
        if (!btn) return;
        btn.textContent = isRecording ? "⏹️ עצור הקלטה" : "⏺️ התחל הקלטה";
        btn.classList.toggle("recording", !!isRecording);
      }

      function wireRecordButton() {
        const btn = document.getElementById("btn-record-fence");
        if (!btn) return;
        btn.addEventListener("click", () => {
          if (!renderer || !renderer.domElement) return;
          if (fenceRecorder && fenceRecorder.state === "recording") {
            fenceRecorder.stop();
            return;
          }
          try {
            const stream = renderer.domElement.captureStream(30);
            const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
            fenceRecChunks = [];
            fenceRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4000000 });
            fenceRecorder.ondataavailable = (e) => { if (e.data && e.data.size) fenceRecChunks.push(e.data); };
            fenceRecorder.onstop = () => {
              setFenceRecordButton(false);
              if (fenceRecChunks.length) {
                const blob = new Blob(fenceRecChunks, { type: "video/webm" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "fence-sim-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".webm";
                a.click();
                URL.revokeObjectURL(a.href);
              }
              fenceRecorder = null;
              fenceRecChunks = [];
            };
            fenceRecorder.start(200);
            setFenceRecordButton(true);
          } catch (err) {
            setFenceRecordButton(false);
          }
        });
      }

      function gatePointerFromEvent(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        if (rect.width < 2 || rect.height < 2) return null;
        gatePointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        gatePointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        gateRaycaster.setFromCamera(gatePointer, camera);
        return gateRaycaster.intersectObject(gateRoot, true);
      }

      function wireGatePointer() {
        if (!renderer || !renderer.domElement) return;
        const el = renderer.domElement;
        el.addEventListener("pointerdown", function (e) {
          gatePtrDown = { x: e.clientX, y: e.clientY };
        });
        el.addEventListener("pointerup", function (e) {
          if (!gatePtrDown || !gateRoot || !camera) {
            gatePtrDown = null;
            return;
          }
          const dx = e.clientX - gatePtrDown.x;
          const dy = e.clientY - gatePtrDown.y;
          gatePtrDown = null;
          if (dx * dx + dy * dy > 36) return;
          const hits = gatePointerFromEvent(e);
          if (hits && hits.length) toggleGate();
        });
        el.addEventListener("pointermove", function (e) {
          if (!gateRoot || !camera) {
            el.style.cursor = "";
            return;
          }
          const hits = gatePointerFromEvent(e);
          el.style.cursor = hits && hits.length ? "pointer" : "";
        });
      }

      window.addEventListener("resize", () => {
        fitFenceRenderer();
      });

      window.addEventListener("message", function (event) {
        if (!event?.data) return;
        if (event.data.type === "applyExternalConfig") {
          try {
            const cfg = event.data.config || {};
            if (cfg.env === "villa" || cfg.env === "garden") {
              currentEnv = cfg.env;
              syncEnvChips();
              applyEnvironmentLook();
            }
            buildFence(cfg);
            fitFenceRenderer();
          } catch (e) {}
        } else if (event.data.type === "requestSimConfig") {
          try {
            if (event.source) {
              event.source.postMessage({
                type: "simConfig",
                reqId: event.data.reqId || null,
                config: { env: currentEnv, kind: "f", gate: lastFenceConfig && lastFenceConfig.gate ? lastFenceConfig.gate : "none" },
              }, "*");
            }
          } catch (e) {}
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        const target = gateOpen ? GATE_OPEN_ANGLE : 0;
        gateAngle += (target - gateAngle) * 0.18;
        if (Math.abs(target - gateAngle) < 0.004) gateAngle = target;
        applyGateAngle();
        if (controls) controls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
      }

      window.onload = () => {
        try {
          var qs = new URLSearchParams(location.search || "");
          if (qs.get("viewOnly") === "1") {
            document.body.classList.add("view-only");
            var hint = document.getElementById("view-orbit-hint");
            if (hint) window.setTimeout(function () { hint.style.opacity = "0"; hint.style.transition = "opacity 0.6s"; }, 4200);
          }
          var urlEnv = qs.get("env");
          if (urlEnv === "villa" || urlEnv === "garden") currentEnv = urlEnv;
        } catch (e) {}
        init();
        animate();
      };
    </script>
  </body>
</html>
